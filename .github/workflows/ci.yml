name: ci

on:
  push:
  pull_request:

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest
          - ubuntu-latest
          - macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - run: cargo build --release --locked
      - name: Smoke release binary
        shell: bash
        run: |
          set -euo pipefail
          bin="target/release/repolens"
          if [ "$RUNNER_OS" = "Windows" ]; then
            bin="target/release/repolens.exe"
          fi
          "$bin" --help
          "$bin" index .
          "$bin" status .
          "$bin" bench . --query ProjectIndex --symbol ProjectIndex --limit 1 --json
