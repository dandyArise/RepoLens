name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: build-${{ matrix.asset }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            asset: repolens-windows-x86_64
            archive: zip
            binary: repolens.exe
          - os: ubuntu-latest
            asset: repolens-linux-x86_64
            archive: tar.gz
            binary: repolens
          - os: ubuntu-24.04-arm
            asset: repolens-linux-arm64
            archive: tar.gz
            binary: repolens
          - os: macos-13
            asset: repolens-darwin-x86_64
            archive: tar.gz
            binary: repolens
          - os: macos-14
            asset: repolens-darwin-arm64
            archive: tar.gz
            binary: repolens

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Build
        run: cargo build --release --locked

      - name: Stage artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "dist/${{ matrix.asset }}"
          cp "target/release/${{ matrix.binary }}" "dist/${{ matrix.asset }}/"
          cp README.md "dist/${{ matrix.asset }}/"
          if compgen -G "LICENSE*" > /dev/null; then
            cp LICENSE* "dist/${{ matrix.asset }}/"
          fi

      - name: Package tar.gz
        if: matrix.archive == 'tar.gz'
        shell: bash
        run: |
          set -euo pipefail
          tar -czf "${{ matrix.asset }}.tar.gz" -C dist "${{ matrix.asset }}"

      - name: Package zip
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          Compress-Archive -Path "dist/${{ matrix.asset }}" -DestinationPath "${{ matrix.asset }}.zip"

      - name: Checksum
        shell: pwsh
        run: |
          $archive = if ("${{ matrix.archive }}" -eq "zip") { "${{ matrix.asset }}.zip" } else { "${{ matrix.asset }}.tar.gz" }
          $hash = (Get-FileHash -Algorithm SHA256 $archive).Hash.ToLower()
          "$hash  $archive" | Out-File -Encoding ascii "${archive}.sha256"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: |
            ${{ matrix.asset }}.*

  publish:
    name: publish-release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Collect artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p upload
          find dist -type f \( -name '*.zip' -o -name '*.tar.gz' -o -name '*.sha256' \) -exec cp {} upload/ \;
          (
            cd upload
            cat *.sha256 | sort > checksums.sha256
          )

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: upload/*
